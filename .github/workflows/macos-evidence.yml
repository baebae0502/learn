# macOS evidence lane. Manual only: macOS minutes on a private repo are billed 10x.
# Drive it from the server with scripts/evidence.sh.
name: macos-evidence

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evidence suite (Playwright tag @<suite>; all = no filter)
        type: choice
        options: [baseline, e2e, evidence, perf, demo, mockups, all]
        default: baseline
      runner:
        description: GitHub-hosted Apple Silicon runner image
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      packaged:
        description: Also build an unsigned electron-builder --dir package
        type: boolean
        default: false
      label:
        description: Evidence label (letters, digits, . _ -)
        type: string
        default: adhoc

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fixtures are generated on Linux (cheap minutes, ffmpeg via apt) and handed to the mac job.
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate label
        env:
          LABEL: ${{ inputs.label }}
        run: |
          if ! [[ "$LABEL" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::label must match ^[A-Za-z0-9._-]{1,64}$"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fixture cache
        id: fixtures-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/generated
          key: fixtures-${{ hashFiles('fixtures/generate.mjs') }}

      - name: Generate fixtures (cache miss)
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm fixtures

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures/generated
          retention-days: 1
          if-no-files-found: error

  mac:
    needs: fixtures
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      SUITE: ${{ inputs.suite }}
      PACKAGED: ${{ inputs.packaged }}
      EVIDENCE_LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep macOS from offering "reopen windows" state restoration between launches
      # (unpackaged Electron and the packaged appId).
      - name: Disable window state restoration
        run: |
          defaults write com.github.Electron ApplePersistenceIgnoreState YES
          defaults write app.learn.desktop ApplePersistenceIgnoreState YES

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Electron binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-44.9.1-darwin-arm64

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @learn/desktop exec install-electron

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures/generated

      - name: Environment report
        run: |
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string hw.model hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType
          ls -la fixtures/generated

      - name: Build
        id: build
        run: pnpm build

      # Evidence only (Playwright #43247 makes packaged launches flaky). A packaging failure is recorded
      # by the skipped spike, and the unpackaged suites still run.
      - name: Package (electron-builder --dir, unsigned)
        id: package
        if: inputs.packaged
        continue-on-error: true
        run: |
          pnpm exec electron-builder --projectDir apps/desktop --dir --mac --arm64 --publish never
          APP="$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Learn.app"
          ls -la "$APP/Contents/MacOS"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::warning::bundle signature invalid after packaging; applying an ad-hoc signature (no identity)"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          fi
          echo "LEARN_PACKAGED_APP=$APP/Contents/MacOS/Learn" >> "$GITHUB_ENV"

      # A hang fails this step (Playwright globalTimeout 10 min inside, step limit 12) instead of cancelling the job.
      # A suite that selects no evidence tests fails fast, except `all` (and `e2e`, which is the functional suite).
      - name: Evidence suite
        id: evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          if [ "$SUITE" = all ]; then
            pnpm exec playwright test -c playwright.evidence.config.ts
          elif [ "$SUITE" = e2e ]; then
            echo "suite e2e: functional E2E only (next step)"
          else
            listing=$(pnpm exec playwright test -c playwright.evidence.config.ts --list --grep "@${SUITE}" 2>&1 || true)
            count=$(sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' <<<"$listing" | tail -n 1)
            if [ "${count:-0}" -eq 0 ]; then
              echo "$listing"
              echo "::error::suite '${SUITE}' selects no evidence tests (tag @${SUITE})"
              exit 1
            fi
            echo "suite ${SUITE}: ${count} evidence tests"
            pnpm exec playwright test -c playwright.evidence.config.ts --grep "@${SUITE}"
          fi

      # The functional E2E suite (tests/e2e, unpackaged app) on Apple Silicon: suites e2e and all.
      - name: Functional E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(fromJSON('["e2e","all"]'), inputs.suite) }}
        timeout-minutes: 8
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence-results/e2e-report.json
        run: pnpm exec playwright test --reporter=list,json --global-timeout 420000

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.label }}-${{ github.run_id }}
          path: |
            evidence-results
            test-results
            !evidence-results/**/*.mov
            !evidence-results/**/*.mp4
            !evidence-results/**/*.webm
            !evidence-results/**/*.frames/**
            !test-results/**/*.webm
            !test-results/**/library/**
            !test-results/**/userdata/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-${{ inputs.label }}-${{ github.run_id }}
          path: |
            evidence-results/**/*.mov
            evidence-results/**/*.mp4
            evidence-results/**/*.webm
            evidence-results/**/*.frames/**
          retention-days: 14
          if-no-files-found: ignore
