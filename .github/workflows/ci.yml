# Linux CI: typecheck, unit tests, build, Electron E2E under Xvfb.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json "packageManager" (pnpm@10.15.1).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Electron binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-44.9.1-${{ runner.os }}-${{ runner.arch }}

      - run: pnpm install --frozen-lockfile

      # Electron 44 has no postinstall; fetch the binary now (from cache when warm).
      - run: pnpm --filter @learn/desktop exec install-electron

      - run: pnpm typecheck
      - run: pnpm test

      - name: Fixture cache
        id: fixtures-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/generated
          key: fixtures-${{ hashFiles('fixtures/generate.mjs') }}

      - name: Generate fixtures (cache miss)
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm fixtures

      - run: pnpm build

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs.
      - name: Allow Chromium sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      # Larger than the 1440×900 window: Chromium shrinks a frameless (hidden title bar) window that is exactly the
      # screen's size by 1 px on Linux, so a 1440×900 screen could not hold the visual tour's 1440×900 viewport.
      - name: E2E (Xvfb)
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm exec playwright test

      # Keeps the evidence harness honest between (expensive) macOS runs; darwin-only captures are skipped.
      - name: Evidence harness (Xvfb)
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_LABEL: ci-linux
        run: xvfb-run -a -s "-screen 0 1440x900x24" pnpm exec playwright test -c playwright.evidence.config.ts

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-ci-linux-${{ github.run_id }}
          path: |
            evidence-results
            !evidence-results/**/*.frames/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload recordings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-ci-linux-${{ github.run_id }}
          path: evidence-results/**/*.frames/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results
            !test-results/**/library/**
            !test-results/**/userdata/**
          retention-days: 7
          if-no-files-found: ignore
